name: tracker
on:
  push:
    branches: [gh-pages, tracker/v1-executive-dashboard]
  pull_request:
    branches: [gh-pages]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test
      - run: npm run validate
